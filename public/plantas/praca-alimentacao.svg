<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" role="img" aria-labelledby="titulo-praca">
  <title id="titulo-praca">Planta da Praça de Alimentação: elevadores ELV-01 e ELV-02, escadas rolantes, Mundo Imersivo, McDonald's, Divino Fogão, Mesa 07 e sanitário PNE.</title>
  <!-- Fundo do pavimento. Coordenadas no MESMO sistema do dados/grafo.json (1 unidade ≈ 1 m, escala 1:500). -->
  <rect x="0" y="0" width="100" height="80" fill="var(--cor-superficie, #f4f6f8)" stroke="var(--cor-borda, #8a94a3)" stroke-width="0.8"/>

  <!-- Corredores (arestas planas do grafo) -->
  <g fill="none" stroke="var(--cor-borda, #8a94a3)" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
    <path d="M20 50 L45 45 L80 60"/>
    <path d="M20 50 L15 30"/>
    <path d="M45 45 L35 25"/>
    <path d="M45 45 L60 25"/>
    <path d="M45 45 L40 30"/>
    <path d="M45 45 L75 45"/>
    <path d="M45 45 L70 60"/>
    <path d="M45 45 L50 50"/>
  </g>

  <!-- Lojas / salas (retângulos ilustrativos sobre as portas do grafo) -->
  <g fill="var(--cor-fundo, #ffffff)" stroke="var(--cor-borda, #8a94a3)" stroke-width="0.6">
    <rect x="6" y="22" width="16" height="10"/>
    <rect x="27" y="16" width="16" height="9"/>
    <rect x="53" y="16" width="16" height="9"/>
    <rect x="64" y="58" width="13" height="9"/>
  </g>

  <!-- Elevadores, escadas rolante e escada -->
  <g fill="var(--cor-primaria, #0b4f8a)" stroke="var(--cor-fundo, #ffffff)" stroke-width="0.5">
    <rect x="17" y="47" width="7" height="7" rx="1"/>
    <rect x="77" y="57" width="7" height="7" rx="1"/>
    <rect x="72" y="42" width="7" height="7" rx="1"/>
    <rect x="37" y="27" width="7" height="7" rx="1"/>
  </g>
  <g font-size="2.6" fill="var(--cor-primaria-texto, #ffffff)" text-anchor="middle" font-weight="bold">
    <text x="20.5" y="52">ELV1</text>
    <text x="80.5" y="62">ELV2</text>
    <text x="75.5" y="47">ROL</text>
    <text x="40.5" y="32">ESC</text>
  </g>

  <!-- Mesa 07 (nó P-MESA-07, x=50 y=50) -->
  <circle cx="50" cy="50" r="2.6" fill="var(--cor-ajuda, #0f7b4f)" stroke="var(--cor-fundo, #ffffff)" stroke-width="0.6"/>

  <!-- Rótulos -->
  <g font-size="3.2" fill="var(--cor-texto, #1c2430)" text-anchor="middle">
    <text x="14" y="28">Mundo Imersivo</text>
    <text x="35" y="21.5">McDonald's</text>
    <text x="61" y="21.5">Divino Fogão</text>
    <text x="70.5" y="63.5">WC PNE</text>
    <text x="50" y="55.5" font-size="2.8" fill="var(--cor-ajuda, #0f7b4f)">Mesa 07</text>
    <text x="45" y="42" font-size="3" fill="var(--cor-texto-suave, #4d5563)">Praça de Alimentação</text>
  </g>
</svg>
